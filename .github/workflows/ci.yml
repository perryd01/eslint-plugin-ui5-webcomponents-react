name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format
        run: bunx oxfmt --check .

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Test oxlint plugin end-to-end
        run: bun run test:oxlint

      - name: Build
        run: bun run build